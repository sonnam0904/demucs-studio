name: Release

# semantic-release reads the conventional-commit messages pushed to master and
# decides the next version; the platform jobs build under that version; the
# release job publishes everything as one GitHub Release.
#
# Publishing from a workflow rather than from a tag trigger is deliberate: tags
# and releases created with GITHUB_TOKEN do not trigger further workflow runs,
# so a tag-triggered build would never fire without an extra PAT.
#
#   version ──┬─→ linux  (ubuntu, builds Linux + Windows) ──┬─→ release
#             └─→ macos  (macOS, builds the .dmg)  ─────────┘
#
# The two build jobs are independent, so they run at the same time and the
# release takes about as long as the slower of them. They cannot be one job:
# Windows cross-compiles from Linux via the pure Go WebView2 loader, but a Wails
# macOS build needs CGO and the system frameworks, so it only runs on a macOS
# host. `version` has to come first because both builds stamp the version into
# what they produce, and it must be the same version in all three.

on:
  push:
    branches: [master]

permissions:
  contents: write # push the changelog commit, create the tag and release
  issues: write # semantic-release opens an issue if a release fails
  pull-requests: write

# Two releases at once would race on the tag and the changelog commit.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Runs the same commit analysis the real release will run, without publishing,
  # purely to learn the version number the build jobs have to stamp in. The two
  # runs see identical commits because the concurrency group above keeps
  # releases from overlapping; if they ever disagreed anyway, the release job
  # checks every filename against the version before publishing.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
      publish: ${{ steps.next.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs the full tag history
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve next version
        id: next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The version comes from a file the exec plugin's verifyReleaseCmd
        # writes, not from the log. Scraping the log looked equivalent and was
        # not: on a first release semantic-release says "There is no previous
        # release, the next release version is 1.0.0" — lowercase "the" — so a
        # pattern written against the usual "The next release version is …"
        # silently matched nothing and skipped the release.
        #
        # verifyRelease runs in dry-run mode (only prepare, publish, addChannel,
        # success and fail are skipped), and the file is written only when there
        # really is a release to make, so its absence is the "nothing to do"
        # signal.
        run: |
          rm -f .next-version
          npx semantic-release --dry-run
          if [ ! -s .next-version ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No release needed for this push."
            exit 0
          fi
          version="$(cat .next-version)"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next version: $version"

  linux:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build

      - name: Unit tests
        run: go test ./...

      - name: Build Linux and Windows packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/release-build.sh "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: packages-linux-windows
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.zip
          if-no-files-found: error
          retention-days: 1

  macos:
    needs: version
    if: needs.version.outputs.publish == 'true'
    # macos-14 and later are Apple Silicon; the build is universal either way,
    # but cross-compiling the arm64 slice is only supported from an arm64 host.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build

      - name: Build macOS package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/release-build-macos.sh "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: packages-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 1

  # Builds nothing: it collects what the platform jobs produced and publishes
  # them together, so the release is never briefly missing a platform. Needing
  # only Node keeps it quick, and it is the sole job that touches the repo.
  release:
    needs: [version, linux, macos]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false # it authenticates with GITHUB_TOKEN itself

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Both jobs' output lands in dist/, where the release asset globs look.
      - uses: actions/download-artifact@v8
        with:
          name: packages-linux-windows
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: packages-macos
          path: dist

      # Guards against publishing a half-built release: three jobs produced
      # these files independently, and a missing .deb or a .dmg stamped with the
      # wrong version would otherwise be discovered by whoever downloaded it.
      - name: Verify every artifact is present
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/check-artifacts.sh "$VERSION" linux windows macos

      - name: Install semantic-release
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
